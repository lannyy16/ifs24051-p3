<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Halaman informasi folder assets untuk proyek PABWE P3.">
  <meta name="theme-color" content="#5b4bdb">
  <link rel="canonical" href="https://ifs24051-p3.vercel.app/assets">
  <title>Assets - PABWE P3</title>
  <style>
    :root{
      --primary:#5b4bdb;
      --text:#29263a;
      --muted:#555064;
      --border:#e5e1f0;
      --bg:#f7f7fb;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
      line-height:1.5;
    }
    .skip-link{
      position:absolute;
      left:-9999px;
      top:8px;
      z-index:1000;
      padding:10px 14px;
      background:#fff;
      color:#29263a;
      border:2px solid var(--primary);
      border-radius:8px;
      font-weight:700;
    }
    .skip-link:focus{
      left:8px;
    }
    .container{
      width:min(720px,calc(100% - 32px));
      margin-inline:auto;
    }
    header{
      background:#fff;
      border-bottom:1px solid var(--border);
      padding:20px 0;
    }
    .brand{
      font-weight:800;
      color:var(--primary);
      text-decoration:none;
    }
    main{padding:48px 0}
    .card{
      background:#fff;
      border:1px solid var(--border);
      border-radius:16px;
      padding:28px;
      box-shadow:0 8px 30px rgba(35,31,70,.08);
    }
    h1{margin-top:0}
    p{color:var(--muted)}
    a{
      color:#4334a8;
      font-weight:600;
    }
    a:focus-visible{
      outline:3px solid rgba(91,75,219,.3);
      outline-offset:3px;
    }
    footer{
      text-align:center;
      color:var(--muted);
      padding:24px 0;
      font-size:.875rem;
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#mainContent">Lewati ke konten utama</a>

  <header>
    <div class="container">
      <a class="brand" href="../index.html?tab=expense">PABWE P3</a>
    </div>
  </header>

  <main id="mainContent">
    <div class="container">
      <section class="card" aria-labelledby="assetsTitle">
        <h1 id="assetsTitle">Folder Assets</h1>
        <p>Folder ini berisi file <code>script.js</code> yang digunakan oleh aplikasi PABWE P3.</p>
        <p><a href="../index.html?tab=expense">Kembali ke aplikasi PABWE P3</a></p>
      </section>
    </div>
  </main>

  <footer>
    <div class="container">PABWE P3 • Assets</div>
  </footer>

</html>
